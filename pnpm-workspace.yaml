packages:
  - 'apps/*'
  - 'packages/*'
  - 'infrastructure/*'

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  'prisma': true
  'esbuild': true
  'unrs-resolver': true
  'argon2': true
  'msgpackr-extract': false
  '@firebase/util': false
  protobufjs: false
  workerd: set this to true or false

# recharts 2 draws nothing on React 19 unless it uses react-is 19 (admin charts).
overrides:
  'recharts>react-is': 19.2.3
  # Security fixes (pnpm audit, 2026-10-12) for packages pulled in by Next, React Native tooling and Firebase.
  'postcss@<8.5.23': ^8.5.28
  'shell-quote@<1.11.0': ^1.11.0
  'source-map-js@<1.2.2': ^1.2.2
  '@grpc/grpc-js@<1.13.6': ^1.13.6
  'sharp@<0.35.5': ^0.35.5
  # Audit L-1 (2026-10-18): deepmerge-ts via the Prisma CLI's config loader. (braces has no fixed release yet:
  # the advisory names 3.0.4, which isn't published; it's only used by Metro at build time.)
  'deepmerge-ts@<8.0.0': ^8.0.0
