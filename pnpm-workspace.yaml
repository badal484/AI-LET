packages:
  - 'apps/*'
  - 'packages/*'
  - 'infrastructure/*'

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  'prisma': true
  'esbuild': true
  'unrs-resolver': true
  'argon2': true
  'msgpackr-extract': false
  '@firebase/util': false
  protobufjs: false

# recharts 2 draws nothing on React 19 unless it uses react-is 19 (admin charts).
overrides:
  'recharts>react-is': 19.2.3
