# Render's free plan sleeps the API after 15 minutes without requests; the first request after that waits
# about a minute. This pings it every 10 minutes. /health/live doesn't touch the database, so Neon can
# still sleep. Not needed once the API is on a paid Render plan (paid services never sleep).
name: Keep API awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the API
        run: curl -fsS -m 90 --retry 2 https://ai-let-fgx6.onrender.com/health/live -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n"
