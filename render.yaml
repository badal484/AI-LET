# Render Blueprint — creates Lovira's whole backend in one go (Dashboard → New → Blueprint → this repo).
# Everything in Singapore (closest to India). You'll be asked for the values marked `sync: false`.
# After the first deploy, copy characters + create the admin: apps/api/scripts/maintenance/copyCatalog.sh

envVarGroups:
  - name: lovira-shared
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      # Render's /usr/bin is read-only: use pnpm through corepack without "corepack enable".
      - key: COREPACK_ENABLE_DOWNLOAD_PROMPT
        value: "0"
      - key: LOG_LEVEL
        value: info
      - key: TRUST_PROXY
        value: "1"
      - key: BILLING_ENFORCE_LIMITS
        value: "true"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRATION
        value: 15m
      - key: JWT_REFRESH_EXPIRATION
        value: 30d
      - key: DEFAULT_CHAT_MODEL
        value: gemini-3.6-flash
      - key: CHAT_PROVIDER
        value: google
      - key: GEMINI_IMPORTANT_ONLY
        value: "true"
      - key: CORS_ORIGIN
        value: https://lovira-admin.onrender.com
      - key: GOOGLE_AI_API_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false

services:
  # The API the app and the admin talk to.
  - type: web
    name: lovira-api
    runtime: node
    region: singapore
    plan: starter
    branch: main
    autoDeploy: true
    healthCheckPath: /health
    buildCommand: >-
      corepack pnpm install --frozen-lockfile &&
      corepack pnpm --filter @ai-companion/api exec prisma generate &&
      corepack pnpm --filter "@ai-companion/api..." run build &&
      corepack pnpm --filter @ai-companion/api exec prisma migrate deploy
    startCommand: cd apps/api && node dist/server.js
    envVars:
      - fromGroup: lovira-shared
      - key: DATABASE_URL
        fromDatabase:
          name: lovira-db
          property: connectionString
      - key: REDIS_HOST
        fromService:
          type: keyvalue
          name: lovira-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: keyvalue
          name: lovira-redis
          property: port

  # Reminders, characters texting first, campaigns, account deletions, after-reply AI work.
  - type: worker
    name: lovira-worker
    runtime: node
    region: singapore
    plan: starter
    branch: main
    autoDeploy: true
    buildCommand: >-
      corepack pnpm install --frozen-lockfile &&
      corepack pnpm --filter @ai-companion/api exec prisma generate &&
      corepack pnpm --filter "@ai-companion/api..." run build
    startCommand: cd apps/api && node dist/worker.js
    envVars:
      - fromGroup: lovira-shared
      - key: DATABASE_URL
        fromDatabase:
          name: lovira-db
          property: connectionString
      - key: REDIS_HOST
        fromService:
          type: keyvalue
          name: lovira-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: keyvalue
          name: lovira-redis
          property: port

  # The admin website (talks to the API through its own /api proxy).
  - type: web
    name: lovira-admin
    runtime: node
    region: singapore
    plan: starter
    branch: main
    autoDeploy: true
    buildCommand: >-
      corepack pnpm install --frozen-lockfile &&
      corepack pnpm --filter "@ai-companion/admin..." run build
    startCommand: cd apps/admin && node_modules/.bin/next start --port $PORT
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: COREPACK_ENABLE_DOWNLOAD_PROMPT
        value: "0"
      - key: API_URL
        value: https://ai-let-fgx6.onrender.com

  # Redis: rate limits, live updates, job queue, caches.
  - type: keyvalue
    name: lovira-redis
    region: singapore
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  - name: lovira-db
    region: singapore
    plan: basic-256mb
    databaseName: lovira
    user: lovira
    postgresMajorVersion: "16"
