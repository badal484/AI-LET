apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: "com.google.gms.google-services"
apply plugin: "com.google.firebase.crashlytics"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //   pnpm keeps hermes-compiler next to react-native, not where the plugin looks: point at it.
    hermesCommand = new File(["node", "--print", "require.resolve('hermes-compiler/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).getParentFile().getAbsolutePath() + "/hermesc/%OS-BIN%/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = true

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.aicompanionmobile"
    defaultConfig {
        applicationId "com.aicompanionmobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Raise for every Play upload: ./gradlew bundleRelease -PloviraVersionCode=2 -PloviraVersionName=1.0.1
        versionCode((project.findProperty('loviraVersionCode') ?: '1') as Integer)
        versionName((project.findProperty('loviraVersionName') ?: '1.0') as String)
    }
    // Release signing (audit C-1): the upload key when it's configured; otherwise a release build refuses to
    // run — except a local test APK asked for explicitly with -PallowDebugSignedRelease (never a Play bundle).
    def hasUploadKey = project.hasProperty('LOVIRA_UPLOAD_STORE_FILE')
    def allowDebugSignedRelease = project.hasProperty('allowDebugSignedRelease')
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // The Play upload key. Its file and passwords live only on the release machine, in
        // ~/.gradle/gradle.properties (never in this repo):
        //   LOVIRA_UPLOAD_STORE_FILE=/absolute/path/lovira-upload.jks
        //   LOVIRA_UPLOAD_STORE_PASSWORD=…   LOVIRA_UPLOAD_KEY_ALIAS=lovira-upload   LOVIRA_UPLOAD_KEY_PASSWORD=…
        // See docs/PLAY_STORE_RELEASE_CHECKLIST.md (keep a backup: a lost upload key means a reset request to Google).
        if (hasUploadKey) {
            release {
                storeFile file(LOVIRA_UPLOAD_STORE_FILE)
                storePassword LOVIRA_UPLOAD_STORE_PASSWORD
                keyAlias LOVIRA_UPLOAD_KEY_ALIAS
                keyPassword LOVIRA_UPLOAD_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Never silently the debug key: upload key, or (local test APK only, opted in) the debug key, or none —
            // and with none the release tasks stop with an explanation (see the checks at the end of this file).
            signingConfig hasUploadKey ? signingConfigs.release : (allowDebugSignedRelease ? signingConfigs.debug : null)
            minifyEnabled enableProguardInReleaseBuilds
            // Crashlytics turns obfuscated stack traces back into readable ones with this mapping file; CI (no real
            // Firebase project) builds with -PnoCrashlyticsUpload.
            firebaseCrashlytics { mappingFileUploadEnabled !project.hasProperty('noCrashlyticsUpload') }
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

// ── Release signing checks (audit C-1) ─────────────────────────────────────────────────────────────────────
def uploadKeyConfigured = project.hasProperty('LOVIRA_UPLOAD_STORE_FILE')

// Any release build: the upload key must be configured, or a debug-signed test APK explicitly requested.
gradle.taskGraph.whenReady { graph ->
    def releaseTasks = graph.allTasks.findAll { it.project == project && it.name ==~ /(assemble|bundle|package|install)Release/ }
    if (releaseTasks.isEmpty()) return
    def isBundle = releaseTasks.any { it.name == 'bundleRelease' }
    if (isBundle && project.hasProperty('allowDebugSignedRelease')) {
        throw new GradleException('bundleRelease is for Google Play and is never signed with the debug key — remove -PallowDebugSignedRelease.')
    }
    if (!uploadKeyConfigured && (isBundle || !project.hasProperty('allowDebugSignedRelease'))) {
        throw new GradleException('Release builds need the upload key: set LOVIRA_UPLOAD_STORE_FILE and the passwords in ~/.gradle/gradle.properties (docs/PLAY_STORE_RELEASE_CHECKLIST.md). For a local test APK only: ./gradlew assembleRelease -PallowDebugSignedRelease')
    }
    if (uploadKeyConfigured && !file(LOVIRA_UPLOAD_STORE_FILE).exists()) {
        throw new GradleException("The upload keystore was not found at LOVIRA_UPLOAD_STORE_FILE (${LOVIRA_UPLOAD_STORE_FILE}).")
    }
}

// After building the Play bundle, check who actually signed it: never the public Android debug certificate.
tasks.matching { it.name == 'bundleRelease' }.configureEach {
    doLast {
        def aab = file("${buildDir}/outputs/bundle/release/app-release.aab")
        if (!aab.exists()) throw new GradleException("Expected ${aab} after bundleRelease")
        def proc = ['keytool', '-printcert', '-jarfile', aab.absolutePath].execute()
        def stdout = new StringBuilder(), stderr = new StringBuilder()
        proc.waitForProcessOutput(stdout, stderr)
        def certs = stdout.toString() + stderr.toString()
        if (!certs.contains('Owner:')) throw new GradleException("Could not read the signature of ${aab.name}:\n${certs}")
        if (certs.contains('CN=Android Debug')) {
            aab.delete()
            throw new GradleException('The Play bundle was signed with the Android debug key — deleted it. Check the upload-key settings.')
        }
        logger.lifecycle("✓ ${aab.name} is signed with the upload key (not the debug key).")
    }
}
